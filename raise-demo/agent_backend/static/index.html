<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAISE</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171a20;
      --panel: #1d2026;
      --panel-2: #23262d;
      --line: #2e3138;
      --text: #f4f4f4;
      --muted: #8e8f94;
      --subtle: #5c5e63;
      --red: #e82127;
      --amber: #f5a623;
      --blue: #3e6ae1;
      font-family: "Gotham SSm", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

    #alert-banner {
      display: none; align-items: center; justify-content: center; gap: 10px;
      background: var(--red); color: #fff; font-weight: 700; letter-spacing: .08em;
      padding: 10px; font-size: 14px; text-transform: uppercase;
    }
    body.failed #alert-banner { display: flex; }

    #topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; border-bottom: 1px solid var(--line);
    }
    #brand { font-size: 18px; font-weight: 600; letter-spacing: .42em; text-indent: .42em; }
    #topbar .right { display: flex; align-items: center; gap: 18px; }
    #eps-warning { display: none; align-items: center; gap: 8px; color: var(--amber); font-size: 12px; letter-spacing: .1em; }
    body.degraded #eps-warning, body.failed #eps-warning { display: flex; }
    body.failed #eps-warning { color: var(--red); }
    #conn { font-size: 11px; color: var(--subtle); letter-spacing: .1em; }

    main {
      display: grid; grid-template-columns: 1.5fr 1fr; gap: 0;
      height: calc(100vh - 49px);
    }
    body.failed main { height: calc(100vh - 49px - 41px); }

    /* ------- drive visualization (left) ------- */
    #drive {
      display: flex; flex-direction: column; padding: 18px 24px 14px; gap: 12px;
      border-right: 1px solid var(--line); min-width: 0;
    }
    #cluster { display: flex; align-items: center; justify-content: space-around; }
    #speed-block { text-align: center; }
    #speed { font-size: 84px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
    #speed-unit { color: var(--muted); font-size: 13px; letter-spacing: .18em; margin-top: 2px; }
    #gear { margin-top: 10px; font-size: 15px; letter-spacing: .5em; text-indent: .5em; color: var(--subtle); }
    #gear .active { color: var(--text); font-weight: 700; }

    #wheel-block { text-align: center; }
    #wheel-svg { width: 210px; height: 210px; }
    #wheel-actual { transition: transform .12s linear; transform-origin: 105px 105px; }
    #wheel-ghost { transition: transform .12s linear; transform-origin: 105px 105px; opacity: .35; }
    #wheel-caption { font-size: 11px; color: var(--muted); letter-spacing: .12em; margin-top: 4px; }
    #wheel-caption .ghost-key { color: var(--subtle); }
    body.degraded #wheel-rim { stroke: var(--amber); }
    body.failed #wheel-rim { stroke: var(--red); }

    #lane { position: relative; height: 74px; border-radius: 8px; overflow: hidden; background: var(--panel); }
    #lane .edge { position: absolute; left: 0; right: 0; height: 3px; background: #3a3d44; }
    #lane .edge.top { top: 8px; } #lane .edge.bottom { bottom: 8px; }
    #lane .dashes {
      position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px;
      background: repeating-linear-gradient(90deg, #4a4d54 0 26px, transparent 26px 52px);
      animation: roadmove 1.2s linear infinite;
    }
    @keyframes roadmove { from { background-position-x: 0; } to { background-position-x: -52px; } }
    body.stopped #lane .dashes { animation-play-state: paused; }
    #car-glyph { position: absolute; left: 50%; top: 50%; transition: transform .25s ease; }

    #camera-frame { flex: 1; min-height: 0; position: relative; border-radius: 10px; overflow: hidden; background: #000; border: 1px solid var(--line); }
    #video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #camera-label { position: absolute; top: 10px; left: 12px; font-size: 10px; letter-spacing: .22em; color: rgba(255,255,255,.75); text-shadow: 0 1px 3px rgba(0,0,0,.9); }

    #metrics { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--line); padding-top: 10px; }
    .metric { text-align: center; }
    .metric b { display: block; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .metric span { font-size: 9.5px; color: var(--subtle); letter-spacing: .14em; }

    #faults { display: flex; gap: 8px; }
    #faults button {
      flex: 1; padding: 9px 0; font-size: 11px; letter-spacing: .12em; font-weight: 600;
      color: var(--muted); background: var(--panel); border: 1px solid var(--line);
      border-radius: 20px; cursor: pointer; transition: all .15s;
    }
    #faults button:hover { color: var(--text); border-color: var(--subtle); }
    #faults button.active-fault { color: #fff; background: #3c1d20; border-color: var(--red); }
    #faults button[data-fault="none"]:hover { border-color: var(--text); }

    /* ------- service console (right) ------- */
    #console { display: flex; flex-direction: column; min-width: 0; }
    #console-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); }
    #console-head h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .18em; color: var(--muted); }
    #incident-chip { font-size: 11px; letter-spacing: .1em; padding: 4px 12px; border-radius: 12px; background: var(--panel); color: var(--subtle); border: 1px solid var(--line); }
    #incident-chip.open { color: #fff; background: #3c1d20; border-color: var(--red); }
    #incident-chip.verify { color: #111; background: var(--amber); border-color: var(--amber); }
    #incident-chip.resolved { color: #111; background: #4cd08a; border-color: #4cd08a; }

    #chat { flex: 1; overflow-y: auto; padding: 14px 20px; display: flex; flex-direction: column; gap: 8px; }
    #chat::-webkit-scrollbar { width: 4px; } #chat::-webkit-scrollbar-thumb { background: var(--line); }
    .msg { white-space: pre-wrap; background: var(--panel-2); border-radius: 10px; padding: 11px 13px; font-size: 13.5px; line-height: 1.45; }
    .msg.operator { background: var(--blue); color: #fff; align-self: flex-end; max-width: 85%; }
    .tool { white-space: pre-wrap; color: var(--subtle); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; padding: 0 4px; overflow-wrap: anywhere; }
    .thinking { color: var(--subtle); font-size: 11px; font-style: italic; padding: 0 4px; }
    .incident-note { font-size: 11.5px; letter-spacing: .04em; color: var(--amber); border-left: 2px solid var(--amber); padding: 4px 10px; }

    #controls { padding: 12px 20px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
    #operator-form { display: flex; gap: 8px; }
    #operator-text {
      flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line);
      border-radius: 20px; padding: 10px 16px; font-size: 13px; outline: none;
    }
    #operator-text:focus { border-color: var(--subtle); }
    #operator-form button, #check-again {
      cursor: pointer; border-radius: 20px; font-weight: 600; font-size: 12px; letter-spacing: .08em;
      padding: 10px 18px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
      transition: all .15s;
    }
    #operator-form button:hover, #check-again:hover { background: var(--panel-2); border-color: var(--subtle); }
    #check-again { width: 100%; background: var(--blue); border-color: var(--blue); color: #fff; }
    #check-again:hover { background: #3560cc; border-color: #3560cc; }

    @media (max-width: 980px) {
      body { overflow: auto; }
      main { grid-template-columns: 1fr; height: auto; }
      #console { border-top: 1px solid var(--line); }
      #chat { max-height: 45vh; }
      #camera-frame { min-height: 220px; }
    }
  </style>
</head>
<body class="stopped">
  <div id="alert-banner">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2 L22 20 L2 20 Z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17" r=".5" fill="#fff"/></svg>
    Steering fault &mdash; vehicle stopped
  </div>
  <div id="topbar">
    <div id="brand">RAISE</div>
    <div class="right">
      <div id="eps-warning">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/>
          <path d="M3.2 10.5 C 7 8.6, 17 8.6, 20.8 10.5"/><path d="M12 14.6 V 21"/>
        </svg>
        <span id="eps-warning-text">STEERING ASSIST REDUCED</span>
      </div>
      <div id="conn">CONNECTING</div>
    </div>
  </div>

  <main>
    <div id="drive">
      <div id="cluster">
        <div id="speed-block">
          <div id="speed">0</div>
          <div id="speed-unit">km/h</div>
          <div id="gear"><span id="gear-p">P</span> <span id="gear-d">D</span></div>
        </div>
        <div id="wheel-block">
          <svg id="wheel-svg" viewBox="0 0 210 210">
            <g id="wheel-ghost">
              <circle cx="105" cy="105" r="84" fill="none" stroke="#5c5e63" stroke-width="5" stroke-dasharray="4 7"/>
              <line x1="105" y1="105" x2="105" y2="168" stroke="#5c5e63" stroke-width="5"/>
            </g>
            <g id="wheel-actual">
              <circle id="wheel-rim" cx="105" cy="105" r="84" fill="none" stroke="#f4f4f4" stroke-width="10"/>
              <line x1="26" y1="105" x2="76" y2="105" stroke="#f4f4f4" stroke-width="9"/>
              <line x1="134" y1="105" x2="184" y2="105" stroke="#f4f4f4" stroke-width="9"/>
              <line x1="105" y1="122" x2="105" y2="184" stroke="#f4f4f4" stroke-width="9"/>
              <circle cx="105" cy="105" r="17" fill="#1d2026" stroke="#f4f4f4" stroke-width="6"/>
            </g>
          </svg>
          <div id="wheel-caption">MEASURED <span class="ghost-key">&middot;&middot;&middot; COMMANDED</span></div>
        </div>
      </div>

      <div id="lane">
        <div class="edge top"></div>
        <div class="dashes"></div>
        <div class="edge bottom"></div>
        <svg id="car-glyph" width="46" height="24" viewBox="0 0 46 24">
          <rect x="1" y="3" width="44" height="18" rx="8" fill="#2e3138" stroke="#8e8f94" stroke-width="1.4"/>
          <rect x="26" y="6" width="10" height="12" rx="3" fill="#171a20"/>
        </svg>
      </div>

      <div id="camera-frame">
        <img id="video" src="/video" alt="Front camera stream">
        <div id="camera-label">FRONT CAMERA</div>
      </div>

      <div id="metrics">
        <div class="metric"><b id="m-cmd">0.0&deg;</b><span>CMD</span></div>
        <div class="metric"><b id="m-actual">0.0&deg;</b><span>MEASURED</span></div>
        <div class="metric"><b id="m-err">0.0&deg;</b><span>ERROR</span></div>
        <div class="metric"><b id="m-corr">&ndash;</b><span>CORR</span></div>
        <div class="metric"><b id="m-lag">0.0s</b><span>LAG</span></div>
        <div class="metric"><b id="m-yaw">0.0&deg;/s</b><span>YAW</span></div>
        <div class="metric"><b id="m-fb">&ndash;</b><span>FEEDBACK</span></div>
      </div>

      <div id="faults">
        <button data-fault="steer_bias">PULL</button>
        <button data-fault="steer_stuck">STUCK</button>
        <button data-fault="steer_noise">WOBBLE</button>
        <button data-fault="steer_lag">LAG</button>
        <button data-fault="steer_reversed">REVERSED</button>
        <button data-fault="none">CLEAR</button>
        <button id="reset-car" title="Tow the car back to its start position">RESET CAR</button>
      </div>
    </div>

    <div id="console">
      <div id="console-head">
        <h2>SERVICE ASSISTANT</h2>
        <span id="incident-chip">NO INCIDENT</span>
      </div>
      <div id="chat"></div>
      <div id="controls">
        <form id="operator-form">
          <input id="operator-text" placeholder="Tell the assistant what you checked..." autocomplete="off">
          <button type="submit">Send</button>
        </form>
        <button id="check-again">Done, check again</button>
      </div>
    </div>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const RAD2DEG = 180 / Math.PI;
    const WHEEL_RATIO = 16;   // rack angle -> hand-wheel angle, for display
    let ws = null;
    let streamDiv = null;
    let thinkDiv = null;

    function add(type, text) {
      const div = document.createElement("div");
      div.className = type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function send(payload) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
    }

    function renderSteps(text) {
      return text.replace(/^(\d+\.\s)/gm, "\n☐ $1").trim();
    }

    function deg(rad, digits = 1) { return (rad * RAD2DEG).toFixed(digits); }

    function setIncidentChip(text, cls) {
      const chip = document.getElementById("incident-chip");
      chip.textContent = text;
      chip.className = cls || "";
    }

    function onHealth(msg) {
      document.body.classList.toggle("failed", msg.status === "FAILED");
      document.body.classList.toggle("degraded", msg.status === "DEGRADED");
      document.getElementById("eps-warning-text").textContent =
        msg.status === "FAILED" ? "STEERING FAULT" : "STEERING ASSIST REDUCED";

      const kmh = Math.max(0, msg.speed_mps * 3.6);
      document.getElementById("speed").textContent = Math.round(kmh);

      const wheelDeg = msg.actual_angle * WHEEL_RATIO * RAD2DEG;
      const ghostDeg = msg.cmd_angle * WHEEL_RATIO * RAD2DEG;
      document.getElementById("wheel-actual").style.transform = `rotate(${wheelDeg}deg)`;
      document.getElementById("wheel-ghost").style.transform = `rotate(${ghostDeg}deg)`;

      // The car glyph drifts across the lane with the steering error and tilts
      // with the measured angle - the visual story of the injected fault.
      const drift = Math.max(-70, Math.min(70, msg.angle_error_mean * 900));
      const tilt = Math.max(-14, Math.min(14, msg.actual_angle * 140));
      document.getElementById("car-glyph").style.transform =
        `translate(calc(-50% + ${drift}px), -50%) rotate(${tilt}deg)`;

      document.getElementById("m-cmd").textContent = `${deg(msg.cmd_angle)}°`;
      document.getElementById("m-actual").textContent = `${deg(msg.actual_angle)}°`;
      document.getElementById("m-err").textContent = `${deg(msg.angle_error_mean)}°`;
      document.getElementById("m-corr").textContent = msg.cmd_actual_corr.toFixed(2);
      document.getElementById("m-lag").textContent = `${msg.response_lag_s.toFixed(1)}s`;
      document.getElementById("m-yaw").textContent = `${deg(msg.yaw_rate)}°/s`;
      document.getElementById("m-fb").textContent = `${msg.feedback_rate_hz.toFixed(0)} Hz`;
    }

    function onMessage(event) {
      const msg = JSON.parse(event.data);
      if (msg.type === "health") {
        onHealth(msg);
      } else if (msg.type === "agent_thinking") {
        if (!thinkDiv) thinkDiv = add("thinking", "");
        thinkDiv.textContent += msg.text;
        chat.scrollTop = chat.scrollHeight;
      } else if (msg.type === "agent_delta") {
        if (!streamDiv) streamDiv = add("msg", "");
        streamDiv.textContent += msg.text;
        chat.scrollTop = chat.scrollHeight;
      } else if (msg.type === "agent_msg") {
        if (streamDiv) {
          streamDiv.textContent = renderSteps(msg.text);
        } else {
          add("msg", renderSteps(msg.text));
        }
        streamDiv = null;
        thinkDiv = null;
      } else if (msg.type === "tool_call") {
        thinkDiv = null;
        add("tool", `▸ ${msg.name} ${JSON.stringify(msg.arguments)}`);
      } else if (msg.type === "tool_result") {
        add("tool", `◂ ${msg.name} ${JSON.stringify(msg.result)}`);
      } else if (msg.type === "incident") {
        if (msg.state === "open") {
          setIncidentChip(`INCIDENT ${msg.incident_id} · ${msg.symptom.toUpperCase()}`, "open");
          add("incident-note", `Incident ${msg.incident_id} opened: ${msg.symptom}`);
        } else if (msg.state === "updated") {
          setIncidentChip(`INCIDENT ${msg.incident_id} · ${msg.symptom.toUpperCase()}`, "open");
          add("incident-note", `Symptom changed: ${msg.symptom}`);
        } else if (msg.state === "awaiting_verification") {
          setIncidentChip(`INCIDENT ${msg.incident_id} · VERIFY`, "verify");
          add("incident-note",
            'Steering health recovered - click "Done, check again" so the assistant can verify the fix');
        } else if (msg.state === "resolved") {
          setIncidentChip("RESOLVED", "resolved");
          add("incident-note", `Incident ${msg.incident_id} resolved`);
          setTimeout(() => setIncidentChip("NO INCIDENT", ""), 8000);
        }
      } else if (msg.type === "car_state") {
        document.body.classList.toggle("stopped", !msg.driving);
        document.getElementById("gear-d").className = msg.driving ? "active" : "";
        document.getElementById("gear-p").className = msg.driving ? "" : "active";
      } else if (msg.type === "car_reset") {
        add("tool", "car reset to start position");
      } else if (msg.type === "fault_result") {
        document.querySelectorAll("#faults button").forEach((b) =>
          b.classList.toggle("active-fault", b.dataset.fault === msg.fault && msg.fault !== "none" && msg.ok));
        add("tool", `fault ${msg.fault}: ${msg.ok ? "ok" : "failed"} - ${msg.message}`);
      }
    }

    function connect() {
      ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
      ws.onopen = () => { document.getElementById("conn").textContent = "ONLINE"; };
      ws.onmessage = onMessage;
      ws.onclose = () => {
        document.getElementById("conn").textContent = "RECONNECTING";
        streamDiv = null;
        thinkDiv = null;
        setTimeout(connect, 2000);
      };
    }
    connect();

    document.querySelectorAll("[data-fault]").forEach((button) => {
      button.addEventListener("click", () => {
        send({ type: "inject_fault", fault: button.dataset.fault });
      });
    });

    document.getElementById("operator-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = document.getElementById("operator-text");
      const text = input.value.trim();
      if (!text) return;
      add("msg operator", text);
      send({ type: "operator_msg", text });
      input.value = "";
    });

    document.getElementById("check-again").addEventListener("click", () => {
      send({ type: "check_again" });
    });

    document.getElementById("reset-car").addEventListener("click", () => {
      send({ type: "reset_car" });
    });
  </script>
</body>
</html>
